# Rate-Limiting: nur für /api/ (nicht für SPA-Shell/statische Assets/PWA-Icons).
# 120 r/m + burst 60 nodelay: ein normaler Tab macht ~20 API-Req/min; ein Kaltstart
# bzw. mehrere Geräte hinter einer Heim-IP feuern mehrere API-Calls gleichzeitig —
# das muss in den Burst passen, sonst 429. burst von 30 auf 60 erhöht (27.06.2026),
# nachdem ein im Hintergrund gepufferter SSE-Rückstau Bursts auslöste; die eigentliche
# Entlastung kommt aus dem Frontend (prefiles/teamspeak nicht mehr je SSE-Frame).
limit_req_zone $binary_remote_addr zone=friesenspy_limit:10m rate=120r/m;

server {
    listen 80;
    server_name friesenspy.devprops.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name friesenspy.devprops.de;
    include snippets/hsts.conf;

    ssl_certificate     /etc/letsencrypt/live/friesenspy.devprops.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/friesenspy.devprops.de/privkey.pem;

    # Gzip fuer die Karten-Datendateien (Platzrunden-GeoJSON, FSE-Plaetze, FSE-Landeflaechen):
    # /etc/nginx/nginx.conf hat "gzip on;" bereits global gesetzt, aber gzip_types dort ist
    # auskommentiert -- es gilt nur der Default text/html, die drei JSON/GeoJSON-Dateien gingen
    # dadurch mit 791 KB statt 189 KB ueber die Leitung. "gzip on;" hier trotzdem explizit
    # wiederholt, damit diese Datei fuer sich genommen vollstaendig ist und nicht von einer
    # globalen Einstellung abhaengt, die wir laut CLAUDE.md nicht anfassen.
    # gzip_proxied: Default ist "off", und JEDE Antwort dieses vHosts kommt per proxy_pass von
    # FastAPI (s. alle drei location-Bloecke unten) -- ohne "any" bliebe die Kompression fuer
    # sie wirkungslos, egal was in gzip_types steht.
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/geo+json application/javascript text/css;

    # SSE-Endpoint: kein Rate-Limit, langer Timeout
    location /api/sse {
        proxy_pass         http://127.0.0.1:8091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # X-Forwarded-For seit 2026-08-19: uvicorn liest mit --proxy-headers
        # diesen Header (nicht X-Real-IP) und kennt damit die echte Adresse
        # des Besuchers. Ohne beides sah die Anwendung nur 127.0.0.1.
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # API-Endpunkte: rate-limitiert (SSE oben ist ausgenommen, längster Prefix gewinnt).
    location /api/ {
        limit_req zone=friesenspy_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # X-Forwarded-For seit 2026-08-19: uvicorn liest mit --proxy-headers
        # diesen Header (nicht X-Real-IP) und kennt damit die echte Adresse
        # des Besuchers. Ohne beides sah die Anwendung nur 127.0.0.1.
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Kartenblaetter: die EINZIGE Stelle dieses vHosts MIT Pufferung.
    #
    # Gemessen am 24.08.2026: Die Anwendung braucht zeitweise ueber eine Sekunde bis zum
    # ersten Byte -- bei /health 0,97 s, unmittelbar danach 6 ms. Der Event-Loop ist also
    # zwischendurch belegt. Ohne Pufferung gibt nginx jedes Stocken unveraendert an den
    # Browser weiter; bei einem 582-KB-Blatt summiert sich das. Ein iPhone hat an dem Tag
    # nach dreieinhalb Minuten abgebrochen (Status 499 im goaccess.log, danach ein zweiter
    # Versuch mit 200). Mit Pufferung holt nginx das Blatt in seinem eigenen Tempo aus der
    # Anwendung und liefert es am Stueck aus.
    #
    # Warum nicht gleich ueberall: /api/sse braucht `proxy_buffering off` zwingend, sonst
    # kommen die Ereignisse in Schueben statt einzeln. Deshalb nur hier.
    location /aip-chart/ {
        proxy_pass         http://127.0.0.1:8091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering    on;
        # Ein uebliches Blatt ist 200-600 KB, das groesste im Bestand 1,3 MB. 64 x 32 KB
        # fassen 2 MB, das Blatt bleibt damit im Speicher und weicht nicht auf die Platte aus.
        proxy_buffer_size  32k;
        proxy_buffers      64 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 8m;
        proxy_cache        off;
    }

    # SPA-Shell, statische Assets, PWA-Icons/Manifest: kein Rate-Limit
    # (der Asset-Schwall beim Laden hat sonst burst 10 gesprengt → 429).
    location / {
        proxy_pass         http://127.0.0.1:8091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # X-Forwarded-For seit 2026-08-19: uvicorn liest mit --proxy-headers
        # diesen Header (nicht X-Real-IP) und kennt damit die echte Adresse
        # des Besuchers. Ohne beides sah die Anwendung nur 127.0.0.1.
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }
}
