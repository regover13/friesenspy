# Rate-Limiting: max. 30 Requests/Minute pro IP, burst 10
limit_req_zone $binary_remote_addr zone=friesenspy_limit:10m rate=30r/m;

server {
    listen 80;
    server_name friesenspy.devprops.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name friesenspy.devprops.de;

    ssl_certificate     /etc/letsencrypt/live/friesenspy.devprops.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/friesenspy.devprops.de/privkey.pem;

    # SSE-Endpoint: kein Rate-Limit, langer Timeout
    location /api/sse {
        proxy_pass         http://127.0.0.1:8091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    location / {
        limit_req zone=friesenspy_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }
}
