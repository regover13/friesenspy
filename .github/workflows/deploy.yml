name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/regover13/friesenspy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy auf VPS via SSH
        if: success()
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: 167.86.127.129
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            cd /opt/friesenspy
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            # Health-Check: Deploy gilt erst als erfolgreich, wenn die App antwortet.
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://127.0.0.1:8091/health | grep -q '"status":"ok"'; then
                echo "Health OK (Versuch $i)"
                exit 0
              fi
            done
            echo "Health-Check fehlgeschlagen — letzte Container-Logs:"
            docker compose logs --tail 50
            exit 1

      # Meldet das Ergebnis des Deploys (inkl. Health-Check) nach Discord.
      # Voraussetzung: Repo-Secret DISCORD_WEBHOOK (Discord-Kanal-Webhook, OHNE /github-Suffix).
      # Fehlt das Secret, wird der Schritt still übersprungen statt den Workflow rot zu färben.
      - name: Discord benachrichtigen
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          # Commit-Daten NUR über env, nie direkt in den Shell-Text interpolieren
          # (sonst könnte eine Commit-Message Befehle einschleusen).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::Secret DISCORD_WEBHOOK nicht gesetzt — Benachrichtigung übersprungen."
            exit 0
          fi
          VERSION=$(jq -r '.[0].version' app/CHANGELOG.json 2>/dev/null || echo '?')
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -1)
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            TEXT='Deploy erfolgreich — Health-Check auf friesenspy.devprops.de bestanden.'
          else
            COLOR=15158332
            TEXT="Deploy fehlgeschlagen ($JOB_STATUS) — auf dem VPS läuft die bisherige Version weiter."
          fi
          jq -n \
            --arg name "FriesenSpy v$VERSION" \
            --arg title "$TITLE" \
            --arg url "$COMMIT_URL" \
            --arg text "$TEXT" \
            --arg actor "$ACTOR" \
            --arg run "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{
                author: {name: $name},
                title: $title,
                url: $url,
                description: ($text + "\n\nvon **" + $actor + "** · [Workflow-Log](" + $run + ")"),
                color: $color
             }]}' > /tmp/discord.json
          curl --fail --silent --show-error -X POST \
               -H 'Content-Type: application/json' \
               -d @/tmp/discord.json "$WEBHOOK" \
            || echo "::warning::Discord-Benachrichtigung fehlgeschlagen — Deploy selbst ist davon unberührt."
